<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心理健康工作平台 · 武汉市光谷第二十六小学</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23A29BFE'/%3E%3Ctext x='32' y='46' font-size='30' text-anchor='middle' fill='white'%3E%F0%9F%92%9C%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#F7F5FA;color:#3D3748;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}

.topbar{background:#fff;border-bottom:1px solid #EAE4F0;padding:13px 20px;display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.bicon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#A29BFE,#54A0FF);
  display:flex;align-items:center;justify-content:center;font-size:18px}
.school{font-size:12px;color:#8379A0}
.ops{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* 登录 */
.loginwrap{max-width:400px;margin:90px auto;padding:0 16px}
.logincard{background:#fff;border-radius:18px;padding:32px;box-shadow:0 8px 32px rgba(120,100,170,.1);text-align:center}
.logincard h2{margin:12px 0 5px;font-size:20px}
.logincard p{color:#8379A0;font-size:13px;margin-bottom:20px}
.li{font-size:46px}
.field{text-align:left;margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input{width:100%;padding:11px 14px;border:2px solid #EAE4F0;border-radius:11px;outline:none}
.field input:focus{border-color:#A29BFE}
.remember{display:flex;align-items:center;gap:7px;font-size:13px;color:#5A5470;margin-bottom:14px}
.msg{color:#E05570;font-size:13px;margin-top:11px}
.lh{font-size:12px;color:#B3A9C9;margin-top:14px}

.btn{padding:10px 19px;border-radius:11px;font-size:14px;font-weight:600;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px}
.btn-p{background:#A29BFE;color:#fff}.btn-p:hover{background:#8B82F0}
.btn-ok{background:#5CD85C;color:#fff}.btn-ok:hover{background:#45C445}
.btn-d{background:#FF8FA3;color:#fff}.btn-d:hover{background:#EE7A92}
.btn-w{background:#FECA57;color:#7A5B00}.btn-w:hover{background:#EDB93F}
.btn-s{background:#fff;border:2px solid #EAE4F0;color:#3D3748}.btn-s:hover{border-color:#A29BFE;color:#A29BFE}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%;justify-content:center}

.tabs{display:flex;gap:3px;border-bottom:2px solid #EAE4F0;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 15px;font-size:14px;font-weight:600;color:#8379A0;cursor:pointer;border-radius:10px 10px 0 0}
.tab:hover{background:#F7F5FA}
.tab.on{color:#A29BFE;border-bottom:3px solid #A29BFE;margin-bottom:-2px}
.nbadge{background:#FF8FA3;color:#fff;font-size:11px;padding:1px 7px;border-radius:9px;font-weight:700;margin-left:3px}

.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(120,100,170,.06);margin-bottom:14px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ch h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
.hint{font-size:12px;color:#A39AB8;line-height:1.6}

/* 工作流条 */
.flow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.flow-step{flex:1;min-width:120px;background:#fff;border:2px solid #EAE4F0;border-radius:12px;
  padding:11px 13px;font-size:12px;font-weight:600;color:#8379A0;cursor:pointer;transition:all .2s;text-align:left}
.flow-step:hover{border-color:#A29BFE}
.flow-step.on{border-color:#A29BFE;background:#EFEDFF;color:#7A6FE0}
.flow-step .n{display:inline-block;width:20px;height:20px;border-radius:6px;background:#A29BFE;color:#fff;
  text-align:center;line-height:20px;font-size:11px;margin-right:5px}
.flow-step.on .n{background:#7A6FE0}

.modal-wide{max-width:780px}
.qedit{background:#F7F5FA;border:2px solid #EAE4F0;border-radius:13px;padding:13px 15px;margin-bottom:10px}
.qedit.on{border-color:#A29BFE;background:#FAFAFF}
.qe-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.qe-no{width:24px;height:24px;border-radius:7px;background:#A29BFE;color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.qe-type{padding:2px 9px;border-radius:9px;font-size:11px;font-weight:700;background:#EDE9FE;color:#7A6FE0}
.qe-ops{margin-left:auto;display:flex;gap:5px}
.qe-input{width:100%;padding:9px 12px;border:2px solid #EAE4F0;border-radius:9px;font-size:13px;outline:none;resize:vertical}
.qe-input:focus{border-color:#A29BFE}
.qe-label{font-size:12px;font-weight:600;margin:7px 0 4px;display:block}
.qe-req{display:flex;align-items:center;gap:6px;font-size:12px;color:#5A5470}
.qe-max{width:90px;padding:7px 10px;border:2px solid #EAE4F0;border-radius:9px;font-size:13px;outline:none}
.addq{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.addq button{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;background:#fff;
  border:2px solid #EAE4F0;color:#3D3748;transition:all .18s}
.addq button:hover{border-color:#A29BFE;color:#A29BFE;background:#EFEDFF}
.stat-bar{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.stat-label{width:130px;font-size:12px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-track{flex:1;height:17px;background:#F0ECF6;border-radius:9px;overflow:hidden;min-width:60px}
.stat-fill{height:100%;background:linear-gradient(90deg,#A29BFE,#54A0FF);border-radius:9px}
.stat-num{width:66px;text-align:right;font-size:11px;color:#8379A0;font-weight:600;flex-shrink:0}
.stat-txt{background:#F7F5FA;border-radius:8px;padding:7px 11px;font-size:12px;margin-bottom:5px;line-height:1.5}

/* 列表项 */
.item{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;
  border:2px solid #F0ECF6;border-radius:13px;margin-bottom:9px;gap:11px;flex-wrap:wrap}
.item:hover{border-color:#A29BFE;background:#FAFAFF}
.imain{flex:1;min-width:190px}
.ititle{font-weight:700;font-size:15px;margin-bottom:4px}
.imeta{display:flex;gap:9px;flex-wrap:wrap;font-size:12px;color:#8379A0}
.iops{display:flex;gap:6px;flex-wrap:wrap}

.tag{padding:2px 9px;border-radius:11px;font-size:11px;font-weight:600}
.t-normal{background:#E8F8E8;color:#2DA84A}
.t-watch{background:#FFF4DC;color:#C8912A}
.t-interview{background:#FFEBEF;color:#D64A68}
.t-retest{background:#EDE9FE;color:#7A6FE0}
.t-draft{background:#F0ECF6;color:#8379A0}
.t-open{background:#E8F4FF;color:#3D8BE8}
.t-closed{background:#F0ECF6;color:#8379A0}
.t-crisis{background:#FFD9E0;color:#C02544}
.t-active{background:#E8F8E8;color:#2DA84A}
.t-referred{background:#EDE9FE;color:#7A6FE0}
.t-today{background:#FFEBEF;color:#D64A68}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F7F5FA;padding:9px;text-align:left;font-weight:600;font-size:12px;color:#8379A0;border-bottom:2px solid #EAE4F0}
td{padding:9px;border-bottom:1px solid #F0ECF6;vertical-align:top}
tr:hover td{background:#FAFAFF}
.tblbox{overflow-x:auto}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar-label{width:140px;font-size:12px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:20px;background:#F0ECF6;border-radius:10px;overflow:hidden;min-width:70px}
.bar-fill{height:100%;border-radius:10px;transition:width .4s;min-width:2px}
.bar-count{width:62px;text-align:right;font-size:12px;color:#8379A0;font-weight:600;flex-shrink:0}

.empty{text-align:center;padding:48px 20px;color:#B3A9C9}
.ei{font-size:50px;margin-bottom:11px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-18px);background:#3D3748;
  color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;z-index:9999;opacity:0;visibility:hidden;
  pointer-events:none;transition:opacity .3s,transform .3s,visibility 0s linear .3s}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);transition:opacity .3s,transform .3s,visibility 0s}
.toast.ok{background:#2ECC71}.toast.err{background:#FF8FA3}
.spin{text-align:center;padding:38px;color:#8379A0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;
  justify-content:center;z-index:300;padding:16px}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto}
.modal h3{margin-bottom:12px;font-size:17px}
.mfield{margin-bottom:12px}
.mfield label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.mfield input,.mfield select,.mfield textarea{width:100%;padding:10px 13px;border:2px solid #EAE4F0;
  border-radius:10px;outline:none;resize:vertical}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{border-color:#A29BFE}
.mrow{display:flex;gap:9px}
.mrow>*{flex:1}
.warnbox{background:#FFF4DC;border-radius:10px;padding:11px 14px;font-size:12px;color:#8A6414;margin-bottom:13px}
.infobox{background:#EDE9FE;border-radius:10px;padding:11px 14px;font-size:12px;color:#5B4BB8;margin-bottom:13px;line-height:1.7}
@media(max-width:640px){
  .bar-label{width:96px;font-size:11px}
  .iops{width:100%}
  .btn{padding:9px 14px;font-size:13px}
  .flow-step{min-width:100%}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="bicon">💜</div>心理健康工作平台</div>
  <div class="school">武汉市光谷第二十六小学</div>
  <div class="ops" id="ops" style="display:none">
    <button class="btn btn-s btn-sm" onclick="location.href='/'">学生端</button>
    <button class="btn btn-s btn-sm" onclick="openPwd()">🔑 改密码</button>
    <button class="btn btn-s btn-sm" onclick="logout()">退出</button>
  </div>
</div>

<!-- 登录 -->
<div id="loginBox" class="loginwrap">
  <div class="logincard">
    <div class="li">👩‍⚕️</div>
    <h2>心理老师登录</h2>
    <p>武汉市光谷第二十六小学 · 心理健康中心</p>
    <div class="field"><label>管理密码</label>
      <input type="password" id="pwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()"></div>
    <label class="remember"><input type="checkbox" id="rememberBox" checked> 记住我（30 天免登录）</label>
    <button class="btn btn-p btn-block" onclick="login()">登录 →</button>
    <div class="msg" id="msg"></div>
    <p class="lh">本系统含敏感心理数据，请勿在公共设备勾选"记住我"</p>
  </div>
</div>

<!-- 主面板 -->
<div id="panel" style="display:none">
  <div class="wrap" style="padding-top:16px">

    <!-- 题库载入进度（24 个量表 669 题分批载入）-->
    <div id="seedBox" style="display:none;margin-bottom:14px;padding:12px 16px;background:#FFF8E7;border:1px solid #F5D9A0;border-radius:12px">
      <div id="seedTxt" style="font-size:13px;font-weight:700;color:#8A6D3B;margin-bottom:8px">正在载入题库…</div>
      <div style="height:8px;background:#F0E4CC;border-radius:5px;overflow:hidden">
        <div id="seedBar" style="height:100%;width:3%;background:linear-gradient(90deg,#FFB86B,#FF8FA3);border-radius:5px;transition:width .3s"></div>
      </div>
    </div>

    <div class="flow">
      <div class="flow-step on" id="fs1" onclick="switchTab('plans')"><span class="n">1</span>普查计划</div>
      <div class="flow-step" id="fs2" onclick="switchTab('screen')"><span class="n">2</span>筛查名单</div>
      <div class="flow-step" id="fs3" onclick="switchTab('interview')"><span class="n">3</span>访谈复核</div>
      <div class="flow-step" id="fs4" onclick="switchTab('cases')"><span class="n">4</span>建档干预</div>
      <div class="flow-step" id="fs5" onclick="switchTab('retest')"><span class="n">5</span>复测提醒</div>
      <div class="flow-step" id="fs6" onclick="switchTab('closure')"><span class="n">6</span>转介/结案</div>
      <div class="flow-step" id="fs7" onclick="switchTab('scales')"><span class="n">⚙</span>量表库</div>
      <div class="flow-step" id="fs8" onclick="switchTab('report')"><span class="n">📊</span>报告</div>
      <div class="flow-step" id="fs9" onclick="switchTab('surveys')"><span class="n">📝</span>问卷调查</div>
    </div>

    <div id="boxPlans"></div>
    <div id="boxScreen" style="display:none"></div>
    <div id="boxInterview" style="display:none"></div>
    <div id="boxCases" style="display:none"></div>
    <div id="boxRetest" style="display:none"></div>
    <div id="boxClosure" style="display:none"></div>
    <div id="boxScales" style="display:none"></div>
    <div id="boxReport" style="display:none"></div>
    <div id="boxSurveys" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<script>
let TOKEN = localStorage.getItem('psych_token') || '';
let SURVEYS = [], EDIT_QS = [], EDIT_SID = null;
let PLANS = [], SCALES = [], SCREEN = [], CASES = [], RETESTS = [], INTERVIEWS = [], REFERRALS = [], CLOSURES = [];
let TAB = 'plans';
let curPlan = '', curCase = null, openRow = null;

const LN = { normal:'正常', watch:'需关注', interview:'需访谈', retest:'需重测',
  daily:'日常关注', focus:'重点关注', crisis:'危机关注' };
const CN = { confirmed:'确认需干预', excluded:'排除', observing:'持续观察', pending:'待访谈' };
const GRADES = ['一年级','二年级','三年级','四年级','五年级','六年级'];

function toast(m,t=''){const e=document.getElementById('toast');e.textContent=m;e.className='toast show '+t;
  setTimeout(()=>{e.className='toast '+t;},2500);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function tagCls(k){return 't-'+(k||'draft')}

async function api(u,opts={}){
  // 注意顺序：...opts 必须在前，否则 opts.headers 会覆盖掉 Authorization
  const r=await fetch(u,{...opts,headers:{Authorization:'Bearer '+TOKEN,...(opts.headers||{})}});
  const ct=r.headers.get('content-type')||'';
  const b=ct.includes('json')?await r.json():await r.text();
  if(r.status===401){ doLogout(); throw new Error('登录已过期，请重新登录'); }
  if(r.status>=400) throw new Error((b&&b.message)||('请求失败 '+r.status));
  return b;
}

// ---------- 登录（持久化）----------
async function login(){
  const pwd=document.getElementById('pwd').value;
  if(!pwd){document.getElementById('msg').textContent='请输入密码';return;}
  const remember=document.getElementById('rememberBox').checked;
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pwd, remember})});
    const d=await r.json();
    if(d.ok){
      TOKEN=d.token;
      if(remember) localStorage.setItem('psych_token',TOKEN);
      else localStorage.removeItem('psych_token');
      document.getElementById('loginBox').style.display='none';
      document.getElementById('panel').style.display='block';
      document.getElementById('ops').style.display='flex';
      document.getElementById('msg').textContent='';
      loadAll();
    } else document.getElementById('msg').textContent='❌ '+(d.message||'密码错误');
  }catch(e){document.getElementById('msg').textContent='❌ '+e.message;}
}

// 启动时若有 token，先静默校验
async function tryRestore(){
  if(!TOKEN) return;
  try{
    const r=await fetch('/api/verify?token='+encodeURIComponent(TOKEN));
    const d=await r.json();
    if(d.ok){
      document.getElementById('loginBox').style.display='none';
      document.getElementById('panel').style.display='block';
      document.getElementById('ops').style.display='flex';
      loadAll();
    } else { localStorage.removeItem('psych_token'); TOKEN=''; }
  }catch(e){}
}
function doLogout(){
  TOKEN=''; localStorage.removeItem('psych_token');
  document.getElementById('panel').style.display='none';
  document.getElementById('loginBox').style.display='block';
  document.getElementById('ops').style.display='none';
  document.getElementById('pwd').value='';
}
function logout(){ if(confirm('确定退出登录？')) doLogout(); }

// ---------- 改密码 ----------
function openPwd(){
  modal('🔑 修改管理密码',
    '<div class="warnbox">修改后旧登录状态会失效，需要用新密码重新登录。<br>请牢记新密码，遗忘需联系技术人员重置。</div>'+
    '<div class="mfield"><label>当前密码</label><input type="password" id="op" autocomplete="current-password"></div>'+
    '<div class="mfield"><label>新密码（至少 6 位）</label><input type="password" id="np" autocomplete="new-password"></div>'+
    '<div class="mfield"><label>确认新密码</label><input type="password" id="np2" autocomplete="new-password"></div>',
    async ()=>{
      const o=document.getElementById('op').value, n=document.getElementById('np').value, n2=document.getElementById('np2').value;
      if(!o||!n){toast('请填写完整','err');return false;}
      if(n.length<6){toast('新密码至少 6 位','err');return false;}
      if(n!==n2){toast('两次输入的新密码不一致','err');return false;}
      try{
        const r=await api('/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({oldPassword:o,newPassword:n})});
        TOKEN=r.token; localStorage.setItem('psych_token',TOKEN);
        toast('密码已修改，请牢记','ok'); closeModal(); return true;
      }catch(e){toast('修改失败: '+e.message,'err');return false;}
    });
}

// ---------- 弹窗 ----------
function modal(title, bodyHtml, onOk){
  document.getElementById('modalHost').innerHTML=
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<h3>'+title+'</h3>'+bodyHtml+
    '<div style="display:flex;gap:9px;justify-content:flex-end;margin-top:16px">'+
    '<button class="btn btn-s" onclick="closeModal()">取消</button>'+
    '<button class="btn btn-p" onclick="modalOk()">确定</button></div></div></div>';
  window._modalOk=onOk;
}
function closeModal(){document.getElementById('modalHost').innerHTML='';window._modalOk=null;}
async function modalOk(){ const f=window._modalOk; if(f){const r=await f(); if(r!==false) closeModal();} }

// ---------- 加载 ----------
// ---------- 题库播种（分块推进 + 进度）----------
// 24 个量表 669 题不能塞进一个请求（Cloudflare 会中断），
// 这里循环调用 /api/seed 分批载入；失败自动降低每次的量，保证一定能推进。
async function ensureSeeded(){
  const box=document.getElementById('seedBox');
  const bar=document.getElementById('seedBar');
  const txt=document.getElementById('seedTxt');
  const show=(pct,msg)=>{
    if(box) box.style.display='block';
    if(bar) bar.style.width=Math.max(3,Math.min(100,pct))+'%';
    if(txt) txt.textContent=msg;
  };
  let budget=150;
  for(let i=0;i<80;i++){
    let d=null;
    try{
      const r=await fetch('/api/seed?limit='+budget,{headers:{Authorization:'Bearer '+TOKEN}});
      d=await r.json();
    }catch(e){
      // 请求失败多半是单次量太大，减半重试
      budget=Math.max(20,Math.floor(budget/2));
      continue;
    }
    if(!d||typeof d!=='object'){ break; }
    const doneAll=(d.metaDone?1:0);
    const pct=d.itemTotal?Math.round((1-(d.missingCount||0)/Math.max(1,d.totalScales||24))*100):50;
    show(pct, d.done?'题库已就绪'
      :`正在载入题库… 还剩 ${d.remaining||d.missingCount||0} / ${d.totalScales||24} 个量表`);
    if(d.done||d.remaining===0){ 
      show(100,'题库已就绪');
      setTimeout(()=>{ if(box) box.style.display='none'; },1200);
      return true;
    }
  }
  show(100,'题库未完整载入，可稍后刷新重试');
  return false;
}

async function loadAll(){
  try{
    await ensureSeeded();
    // 并行拉取：原来是 9 个串行 await，每个都要等前一个完成。
    // 互不依赖的接口一起发，教师端打开速度取决于最慢的单个请求而非总和。
    const [sc, pl, cs, rt, iv, rf, cl, sv] = await Promise.all([
      api('/api/admin/scales'),
      api('/api/admin/plans'),
      api('/api/admin/cases'),
      api('/api/admin/retests'),
      api('/api/admin/interviews'),
      api('/api/admin/referrals'),
      api('/api/admin/closures'),
      api('/api/admin/surveys'),
    ]);
    SCALES=sc||[]; PLANS=pl||[]; CASES=cs||[]; RETESTS=rt||[];
    INTERVIEWS=iv||[]; REFERRALS=rf||[]; CLOSURES=cl||[]; SURVEYS=sv||[];
    if(!curPlan&&PLANS.length) curPlan=PLANS[0].id;
    // 筛查名单依赖当前选中的普查，放第二批
    SCREEN=await api('/api/admin/screenings'+(curPlan?'?planId='+encodeURIComponent(curPlan):''))||[];
  }catch(e){ toast('加载失败: '+e.message,'err'); return; }
  renderAll();
}
// 标签角标：各环节的待办数量（CSS 类 .nbadge 已内置）
function updateTabBadges(){
  try{
    const set=(id,n)=>{
      const el=document.getElementById(id); if(!el) return;
      let b=el.querySelector('.nbadge');
      if(!n){ if(b) b.remove(); return; }
      if(!b){ b=document.createElement('span'); b.className='nbadge'; el.appendChild(b); }
      b.textContent=n;
    };
    set('fs2',(SCREEN||[]).filter(x=>x.suggested==='interview').length);   // 待访谈
    set('fs5',(RETESTS||[]).filter(x=>x.status==='pending').length);        // 待复测
    set('fs4',(CASES||[]).filter(x=>x.status==='active').length);           // 在案
  }catch(e){ /* 角标失败不影响主流程 */ }
}

function renderAll(){
  // 逐个渲染，单个模块出错不影响其他模块
  const jobs = [
    ['plans', renderPlans], ['screen', renderScreen], ['interview', renderInterview],
    ['cases', renderCases], ['retest', renderRetest], ['closure', renderClosure],
    ['scales', renderScales], ['report', renderReport], ['surveys', renderSurveys],
  ];
  // 一次性写入 DOM：先拼好所有 innerHTML 再赋值，避免逐次触发重排
  for (const [name, fn] of jobs) {
    try { fn(); } catch (e) { console.error('渲染失败 ' + name, e); }
  }
  updateTabBadges();
}

function switchTab(t){

function newPlan(){
  modal('➕ 新建普查计划', planForm(null), async ()=>{

      term:document.getElementById('fpTerm').value, gradeScope:selG, scaleIds:selS,
      startAt:document.getElementById('fpStart').value, endAt:document.getElementById('fpEnd').value,

      gradeScope:selG,scaleIds:selS,startAt:document.getElementById('fpStart').value,
      endAt:document.getElementById('fpEnd').value,anonymous:document.getElementById('fpAnon').checked,
      notice:document.getElementById('fpNotice').value,status:p.status};

  } else {

      '<th>周期</th><th>到期日</th><th>状态</th><th>操作</th></tr></thead><tbody>'+

          (r.status==='done'?'已完成':'待复测')+'</span></td>'+
        '<td>'+(r.status!=='done'
          ? '<button class="btn btn-ok btn-sm" onclick="doneRetest(\''+esc(r.id)+'\')">标记完成</button> '
          : '')+
        '<button class="btn btn-s btn-sm" onclick="showCompare(\''+esc(r.studentKey)+'\')">前后对比</button></td></tr>';
      }).join('')+'</tbody></table></div></div>';

async function doneRetest(id){
  await api('/api/admin/retest',{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id,status:'done',donePlanId:curPlan})});

async function showCompare(key){
  let d;
  try{ d=await api('/api/admin/compare?studentKey='+encodeURIComponent(key)); }
  catch(e){toast('加载失败','err');return;}
  if(!d.ok||!d.count){toast('该学生暂无多次作答记录','err');return;}
  // 收集所有维度名
  const dims={};
  d.series.forEach(s=>{ (s.dims||[]).forEach(x=>{ if(x&&x.name) dims[x.name]=dims[x.name]||{max:x.max||10}; }); });
  const names=Object.keys(dims);
  let rows='';
  if(!names.length) rows='<div class="hint">暂无维度数据</div>';
  names.forEach(n=>{
    rows+='<div style="margin-bottom:11px"><div style="font-size:13px;font-weight:600;margin-bottom:5px">'+esc(n)+'</div>';
    const vals=d.series.map(s=>{const x=(s.dims||[]).find(y=>y&&y.name===n);return x?x.raw:null;});
    const mx=Math.max(10,...vals.map(v=>v||0));
    rows+=d.series.map((s,i)=>'<div class="bar-row"><div class="bar-label">'+esc(String(s.date||'').slice(0,10))+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+(vals[i]!=null?Math.round(vals[i]/mx*100):0)+'%;background:'+
      (i===0?'#C9C2F0':i===d.series.length-1?'#A29BFE':'#54A0FF')+'"></div></div>'+
      '<div class="bar-count">'+(vals[i]!=null?vals[i]:'—')+'</div></div>').join('');
    // 趋势
    const first=vals[0], last=vals[vals.length-1];
    if(first!=null&&last!=null&&d.series.length>1){
      const diff=last-first;
      const better = diff<0;  // 心理量表多为"分越高越差"
      rows+='<div style="font-size:12px;color:'+(diff===0?'#8379A0':better?'#2DA84A':'#D64A68')+';margin-top:3px">'+
        (diff===0?'持平':(diff>0?'↑ +':'↓ ')+Math.abs(diff)+' 分')+
        '（'+(better?'好转':'需继续关注')+'）</div>';
    }
    rows+='</div>';
  });
  modal('📈 前后测对比（'+d.count+' 次）', rows+
    '<div class="hint" style="margin-top:10px">左侧为最早一次，右侧为最近一次。多数心理量表分数越低越好。</div>',
    ()=>true);
}

function importItems(id){
  const s=SCALES.find(x=>x.id===id); if(!s)return;
  modal('📥 导入题目 · '+esc(s.shortName||s.name),
    '<div class="warnbox">⚠️ 请确认已取得该量表的<b>书面授权</b>。题目将存储在你自己的数据库中，'+
    '请勿导入未授权内容。</div>'+
    '<div class="mfield"><label>题目（每行一道，格式：题号|维度名|题干|选项1/选项2/选项3）</label>'+
    '<textarea id="itText" rows="8" placeholder="1|学习焦虑|我常常担心考试|不符合/有点符合/完全符合&#10;2|学习焦虑|我睡不好|不符合/有点符合/完全符合"></textarea></div>'+
    '<div class="hint" style="margin-bottom:11px">维度名需与「维度与临界值」里的名称一致，系统会自动归组计分。</div>'+
    '<div class="mfield"><label>计分映射（选项=分数，英文逗号分隔）</label>'+
    '<input id="itMap" value="不符合=0,有点符合=1,完全符合=2"></div>'+
    '<div class="hint">效度题请在题干前加 [V] 标记，系统会用于社会赞许性检测。</div>',
    async ()=>{
      const txt=document.getElementById('itText').value.trim();
      if(!txt){toast('请输入题目','err');return false;}
      const mapText=document.getElementById('itMap').value.trim();
      const scoreMap={};
      mapText.split(',').forEach(kv=>{const[k,v]=kv.split('=').map(x=>x.trim()); if(k)scoreMap[k]=Number(v)||0;});
      const items=txt.split('\n').map(l=>{
        const parts=l.split('|').map(x=>x.trim());
        // 4 段：题号|维度名|题干|选项；3 段：题号|题干|选项
        const hasDim = parts.length>=4;
        const title = hasDim ? (parts[2]||'') : (parts[1]||parts[0]||'');
        const dimName = hasDim ? (parts[1]||'') : '';
        const optStr = hasDim ? (parts[3]||'') : (parts[2]||'');
        const isV=title.startsWith('[V]');
        return {title:isV?title.slice(3).trim():title, dimName,
          options:optStr.split('/').map(x=>x.trim()).filter(Boolean),
          type:isV?'validity':'normal', scoreMap};
      }).filter(x=>x.title);
      const r=await api('/api/admin/scale-items',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({scaleId:id,items})});
      toast(r.message||'已导入','ok'); await loadAll(); return true;
    });
}

// 宽版弹窗（题目编辑器需要更大空间）
function modal2(title, bodyHtml, onOk){
  document.getElementById('modalHost').innerHTML=
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal modal-wide">'+
    '<h3>'+title+'</h3>'+bodyHtml+
    '<div style="display:flex;gap:9px;justify-content:flex-end;margin-top:16px">'+
    '<button class="btn btn-s" onclick="closeModal()">取消</button>'+
    '<button class="btn btn-p" onclick="modalOk()">保存</button></div></div></div>';
  window._modalOk=onOk;
}

function syncQs(){
  EDIT_QS.forEach((q,i)=>{
    const t=document.getElementById('qt_'+i); if(t) q.title=t.value;
    const o=document.getElementById('qo_'+i);
    if(o) q.options=o.value.split('\n').map(x=>x.trim()).filter(Boolean);
    const r=document.getElementById('qr_'+i); if(r) q.required=r.checked;
    const m=document.getElementById('qm_'+i); if(m) q.config={max:Number(m.value)||5};
  });
}

function renderQEdit(){
  const box=document.getElementById('qeditList'); if(!box)return;
  const c=document.getElementById('qCount'); if(c)c.textContent=EDIT_QS.length;
  if(!EDIT_QS.length){
    box.innerHTML='<div class="empty" style="padding:26px"><div class="ei">❓</div>'+
      '<p>还没有题目，点下面的按钮添加</p></div>';
    return;
  }
  box.innerHTML=EDIT_QS.map((q,i)=>{
    const hasOpt=['single','multi','scale'].includes(q.type);
    return '<div class="qedit"><div class="qe-head">'+
      '<span class="qe-no">'+(i+1)+'</span>'+
      '<span class="qe-type">'+QT[q.type]+'</span>'+
      '<span class="qe-ops">'+
      '<button class="btn btn-s btn-sm" onclick="moveQ('+i+',-1)"'+(i===0?' disabled':'')+'>↑</button>'+
      '<button class="btn btn-s btn-sm" onclick="moveQ('+i+',1)"'+(i===EDIT_QS.length-1?' disabled':'')+'>↓</button>'+
      '<button class="btn btn-d btn-sm" onclick="delQ('+i+')">✕</button>'+
      '</span></div>'+
      '<label class="qe-label">题干</label>'+
      '<input class="qe-input" id="qt_'+i+'" value="'+esc(q.title)+'" placeholder="请输入题目">'+
      (hasOpt?'<label class="qe-label">选项（每行一个）</label>'+
        '<textarea class="qe-input" id="qo_'+i+'" rows="'+(q.options.length||3)+'">'+esc((q.options||[]).join('\n'))+'</textarea>':'')+
      (q.type==='rating'?'<label class="qe-label">最高分</label>'+
        '<input class="qe-max" type="number" id="qm_'+i+'" value="'+((q.config||{}).max||5)+'" min="2" max="10">':'')+
      (!hasOpt&&q.type!=='rating'?'<div class="hint" style="margin-top:6px">学生自由填写</div>':'')+
      '<label class="qe-req" style="margin-top:8px"><input type="checkbox" id="qr_'+i+'"'+
        (q.required!==false?' checked':'')+'> 必填</label>'+
      '</div>';
  }).join('');
}

function addQ(type){ syncQs(); EDIT_QS.push({id:newQid(),type,title:'',
  options:(DEF_OPT[type]||[]).slice(),required:true,config:{max:5}}); renderQEdit(); }
function moveQ(i,d){ syncQs(); const j=i+d;
  if(j<0||j>=EDIT_QS.length)return;
  const t=EDIT_QS[i]; EDIT_QS[i]=EDIT_QS[j]; EDIT_QS[j]=t; renderQEdit(); }
function delQ(i){ syncQs(); EDIT_QS.splice(i,1); renderQEdit(); }

        (q.count?Math.round(x.n/q.count*100):0)+'%"></div></div>'+

// ==================== 量表编辑器（自建 / 修改）====================
const ITEM_TYPE = { normal:'普通题', validity:'效度题', filler:'插入题', risk:'风险题' };
const RESP = { binary:'是否（2选1）', likert3:'三级（如 不符合/有点/完全）',
  likert3rev:'三级反向（经常=2/有时=1/没有=0）', likert4:'四级', likert5:'五级',
  likert6:'六级', likert7:'七级', freq4:'频率四级', event5:'事件五级（无/轻/中/重）',
  likert3custom:'三级·每题独立选项' };
const DEF_SCORE = { binary:'是=1,否=0', likert3:'0,1,2', likert3rev:'2,1,0',
  likert4:'1,2,3,4', likert5:'1,2,3,4,5', likert6:'1,2,3,4,5,6',
  likert7:'1,2,3,4,5,6,7', freq4:'0,1,2,3', event5:'0,1,2,3', likert3custom:'0,1,2' };
const DEF_OPTS = {
  binary:['是','否'], likert3:['不符合','有点符合','完全符合'],
  likert3rev:['经常','有时','没有'], likert4:['很不符合','不符合','符合','非常符合'],
  likert5:['完全不符合','不太符合','一般','比较符合','完全符合'],
  likert6:['非常不同意','不同意','有点不同意','有点同意','同意','非常同意'],
  likert7:['极不同意','很不同意','稍不同意','中立','稍同意','很同意','极同意'],
  freq4:['从来没有','1–2 次','每月几次','每周至少一次'],
  event5:['没有发生','没有影响','轻度','中度','重度'],
};

let ESC = null;   // 当前编辑的量表 {meta, dims, items}

function newQItemId(){ return 'si' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

async function newScale(){
  const name = prompt('量表名称（如：校园归属感问卷）：', '校本自编量表');
  if(!name) return;
  const code = prompt('量表代号（英文，如 BELONG）：', 'CUSTOM');
  if(!code) return;
  let r;
  try{
    r = await api('/api/admin/scale', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name.trim(), code:code.trim(), shortName:name.trim(),
        responseType:'likert5', gradeRange:'1-6',
        dims:[{name:'总分', itemCount:0, direction:'higher_worse', maxScore:0}]})});
  }catch(e){ toast('创建失败：'+e.message,'err'); return; }
  toast('量表已创建，请添加维度与题目','ok');
  await loadAll(); await editScale(r.id);
}

async function delScale(id){
  if(!confirm('删除这个量表？维度和题目都会删除，已提交的答卷数据不受影响。')) return;
  try{ await api('/api/admin/scale?id='+encodeURIComponent(id),{method:'DELETE'});
    toast('已删除','ok'); await loadAll(); }
  catch(e){ toast(e.message,'err'); }
}

async function editScale(id){
  const s = SCALES.find(x=>x.id===id);
  if(!s){ toast('量表不存在','err'); return; }
  let items=[];
  try{ items = await api('/api/admin/scale-items?scaleId='+encodeURIComponent(id)); }
  catch(e){}
  const dims = (s.dims||[]).map((d,i)=>({ key:'k'+i, id:d.id, name:d.name, itemCount:d.itemCount,
    direction:d.direction||'higher_worse', maxScore:d.maxScore||0,
    cutNormal:(d.cutNormal==null?'':d.cutNormal), cutBorder:(d.cutBorder==null?'':d.cutBorder), note:d.note||'' }));
  if(!dims.length) dims.push({ key:'k0', id:'', name:'总分', itemCount:0,
    direction:'higher_worse', maxScore:0, cutNormal:'', cutBorder:'', note:'' });
  const dimByReal = {}; dims.forEach(d=>{ dimByReal[d.id]=d.key; });
  ESC = { id, meta:{...s}, dims,
    items: items.map(it=>{
      const sm = it.scoreMap || {};
      const opts = it.options || [];
      const scoreText = opts.map(o => (sm[o]!=null ? sm[o] : '')).join(',');
      return { id:it.id, dimId: dimByReal[it.dimId] || '', type:it.type||'normal',
        title:it.title, options:opts, reverse:!!it.reverse, scoreText };
    }) };

  modal2('✏️ 编辑量表 · '+esc(s.shortName||s.name),
    '<div class="mrow"><div class="mfield"><label>量表名称</label><input id="scName" value="'+esc(s.name)+'"></div>'+
    '<div class="mfield"><label>代号</label><input id="scCode" value="'+esc(s.code)+'"></div></div>'+
    '<div class="mrow"><div class="mfield"><label>适用年级</label><input id="scGrade" value="'+esc(s.gradeRange||'')+'" placeholder="如 1-6"></div>'+
    '<div class="mfield"><label>作答方式</label><select id="scResp">'+
      Object.entries(RESP).map(([k,v])=>'<option value="'+k+'"'+(s.responseType===k?' selected':'')+'>'+v+'</option>').join('')+
    '</select></div></div>'+
    '<div class="mfield"><label>维度说明</label><textarea id="scDimNote" rows="2">'+esc(s.dimensionNote||'')+'</textarea></div>'+
    '<div class="mfield"><label>计分与分档说明</label><textarea id="scScoreNote" rows="2">'+esc(s.scoringNote||'')+'</textarea></div>'+

    '<div style="font-weight:700;margin:16px 0 9px;display:flex;align-items:center;gap:9px">'+
      '维度（<span id="scDimCount">'+dims.length+'</span>）'+
      '<button class="btn btn-s btn-sm" onclick="addScaleDim()">➕ 加维度</button></div>'+
    '<div id="scDimList"></div>'+

    '<div style="font-weight:700;margin:16px 0 9px;display:flex;align-items:center;gap:9px">'+
      '题目（<span id="scItemCount">'+ESC.items.length+'</span>）'+
      '<button class="btn btn-s btn-sm" onclick="addScaleItem(\'normal\')">➕ 普通题</button>'+
      '<button class="btn btn-s btn-sm" onclick="addScaleItem(\'validity\')">🛡 效度题</button>'+
      '<button class="btn btn-s btn-sm" onclick="addScaleItem(\'filler\')">💬 插入题</button></div>'+
    '<div id="scItemList"></div>',
    saveScale);
  renderScaleDims(); renderScaleItems();
}

function syncScale(){
  if(!ESC) return;
  const g = i => document.getElementById(i);
  if(g('scName')) ESC.meta.name = g('scName').value;
  if(g('scCode')) ESC.meta.code = g('scCode').value;
  if(g('scGrade')) ESC.meta.gradeRange = g('scGrade').value;
  if(g('scResp')) ESC.meta.responseType = g('scResp').value;
  if(g('scDimNote')) ESC.meta.dimensionNote = g('scDimNote').value;
  if(g('scScoreNote')) ESC.meta.scoringNote = g('scScoreNote').value;
  ESC.dims.forEach((d,i)=>{
    const n=g('sDn_'+i); if(n) d.name=n.value;
    const dir=g('sDd_'+i); if(dir) d.direction=dir.value;
    const ms=g('sDm_'+i); if(ms) d.maxScore=Number(ms.value)||0;
    const cn=g('sDcn_'+i); if(cn) d.cutNormal=cn.value===''?'':Number(cn.value);
    const cb=g('sDcb_'+i); if(cb) d.cutBorder=cb.value===''?'':Number(cb.value);
  });
  ESC.items.forEach((it,i)=>{
    const t=g('sIt_'+i); if(t) it.title=t.value;
    const dm=g('sId_'+i); if(dm) it.dimId=dm.value;
    const tp=g('sIy_'+i); if(tp) it.type=tp.value;
    const o=g('sIo_'+i); if(o) it.options=o.value.split('\n').map(x=>x.trim()).filter(Boolean);
    const s=g('sIs_'+i); if(s) it.scoreText=s.value;
    const r=g('sIr_'+i); if(r) it.reverse=r.checked;
  });
}

function renderScaleDims(){
  const box=document.getElementById('scDimList'); if(!box||!ESC) return;
  const c=document.getElementById('scDimCount'); if(c) c.textContent=ESC.dims.length;
  box.innerHTML = ESC.dims.map((d,i)=>
    '<div class="qedit"><div class="qe-head"><span class="qe-no">D'+(i+1)+'</span>'+
    '<input class="qe-input" style="flex:1;max-width:220px" id="sDn_'+i+'" value="'+esc(d.name)+'" placeholder="维度名">'+
    '<span class="qe-ops"><button class="btn btn-d btn-sm" onclick="delScaleDim('+i+')">✕</button></span></div>'+
    '<div class="mrow" style="gap:8px;margin-top:7px">'+
    '<div style="flex:1"><label class="qe-label">方向</label>'+
    '<select class="qe-input" id="sDd_'+i+'">'+
      '<option value="higher_worse"'+(d.direction==='higher_worse'?' selected':'')+'>越高越需关注</option>'+
      '<option value="higher_better"'+(d.direction==='higher_better'?' selected':'')+'>越高越好</option></select></div>'+
    '<div style="width:88px"><label class="qe-label">满分</label>'+
    '<input class="qe-max" style="width:100%" type="number" id="sDm_'+i+'" value="'+esc(d.maxScore)+'"></div>'+
    '<div style="width:88px"><label class="qe-label">正常界</label>'+
    '<input class="qe-max" style="width:100%" type="number" id="sDcn_'+i+'" value="'+esc(d.cutNormal)+'"></div>'+
    '<div style="width:88px"><label class="qe-label">异常界</label>'+
    '<input class="qe-max" style="width:100%" type="number" id="sDcb_'+i+'" value="'+esc(d.cutBorder)+'"></div>'+
    '</div></div>').join('');
}

function renderScaleItems(){
  const box=document.getElementById('scItemList'); if(!box||!ESC) return;
  const c=document.getElementById('scItemCount'); if(c) c.textContent=ESC.items.length;
  if(!ESC.items.length){
    box.innerHTML='<div class="empty" style="padding:24px"><div class="ei">❓</div>'+
      '<p>还没有题目，点上面按钮添加，或用「批量导入」一次性导入</p></div>'; return;
  }
  box.innerHTML = ESC.items.map((it,i)=>{
    const needOpt = it.type!=='risk';
    return '<div class="qedit"><div class="qe-head"><span class="qe-no">'+(i+1)+'</span>'+
    '<span class="qe-type" style="'+(it.type==='validity'?'background:#FFEBEF;color:#C0455F':
      it.type==='filler'?'background:#F0ECF6;color:#8379A0':
      it.type==='risk'?'background:#FFE8E8;color:#D63A3A':'')+'">'+ITEM_TYPE[it.type]+'</span>'+
    '<span class="qe-ops">'+
      '<button class="btn btn-s btn-sm" onclick="moveScaleItem('+i+',-1)"'+(i===0?' disabled':'')+'>↑</button>'+
      '<button class="btn btn-s btn-sm" onclick="moveScaleItem('+i+',1)"'+(i===ESC.items.length-1?' disabled':'')+'>↓</button>'+
      '<button class="btn btn-d btn-sm" onclick="delScaleItem('+i+')">✕</button></span></div>'+
    '<div class="mrow" style="gap:8px">'+
      '<div style="width:150px"><label class="qe-label">所属维度</label>'+
      '<select class="qe-input" id="sId_'+i+'"><option value="">（不计分）</option>'+
      ESC.dims.map(d=>'<option value="'+esc(d.key)+'"'+(it.dimId===d.key?' selected':'')+'>'+esc(d.name)+'</option>').join('')+
      '</select></div>'+
      '<div style="width:110px"><label class="qe-label">题型</label>'+
      '<select class="qe-input" id="sIy_'+i+'">'+
      Object.entries(ITEM_TYPE).filter(x=>x[0]!=='risk'||it.type==='risk')
        .map(([k,v])=>'<option value="'+k+'"'+(it.type===k?' selected':'')+'>'+v+'</option>').join('')+
      '</select></div>'+
      '<label class="qe-req" style="align-self:flex-end;padding-bottom:8px">'+
      '<input type="checkbox" id="sIr_'+i+'"'+(it.reverse?' checked':'')+'> 反向</label>'+
    '</div>'+
    '<label class="qe-label">题干</label>'+
    '<input class="qe-input" id="sIt_'+i+'" value="'+esc(it.title)+'" placeholder="请输入题干">'+
    (needOpt?'<div class="mrow" style="gap:8px;margin-top:7px">'+
      '<div style="flex:1"><label class="qe-label">选项（每行一个）</label>'+
      '<textarea class="qe-input" id="sIo_'+i+'" rows="'+Math.min(Math.max(it.options.length,2),6)+'">'+esc((it.options||[]).join('\n'))+'</textarea></div>'+
      '<div style="width:130px"><label class="qe-label">分值（逗号分隔）</label>'+
      '<input class="qe-input" id="sIs_'+i+'" value="'+esc(it.scoreText||'')+'" placeholder="0,1,2"></div>'+
      '</div>':'<div class="hint" style="margin-top:6px">风险题选到最高分会自动触发危机预警</div>')+
    '</div>';
  }).join('');
}

function addScaleDim(){ syncScale();
  ESC.dims.push({key:'k'+Date.now().toString(36), id:'', name:'', itemCount:0,
    direction:'higher_worse', maxScore:0, cutNormal:'', cutBorder:'', note:''});
  renderScaleDims(); renderScaleItems(); }
function delScaleDim(i){ syncScale(); ESC.dims.splice(i,1); renderScaleDims(); renderScaleItems(); }
function addScaleItem(type){ syncScale();
  const rt = ESC.meta.responseType || 'likert5';
  const opts = (DEF_OPTS[rt] || ['完全不符合','不太符合','一般','比较符合','完全符合']).slice();
  ESC.items.push({ id:newQItemId(), dimId: ESC.dims[0]?ESC.dims[0].key:'', type,
    title:'', options: type==='filler'?[]:opts, reverse:false,
    scoreText: DEF_SCORE[rt] || '0,1,2' });
  renderScaleItems(); }
function moveScaleItem(i,d){ syncScale(); const j=i+d;
  if(j<0||j>=ESC.items.length) return;
  const t=ESC.items[i]; ESC.items[i]=ESC.items[j]; ESC.items[j]=t; renderScaleItems(); }
function delScaleItem(i){ syncScale(); ESC.items.splice(i,1); renderScaleItems(); }

async function saveScale(){
  syncScale();
  if(!ESC) return true;
  if(!String(ESC.meta.name||'').trim()){ toast('请填写量表名称','err'); return false; }
  const di = ESC.dims.findIndex(d=>!String(d.name||'').trim());
  if(di>=0){ toast('第 '+(di+1)+' 个维度还没填名称','err'); return false; }
  const ii = ESC.items.findIndex(it=>!String(it.title||'').trim());
  if(ii>=0){ toast('第 '+(ii+1)+' 题还没写题干','err'); return false; }
  const oi = ESC.items.findIndex(it=>it.type!=='filler' && !(it.options||[]).length);
  if(oi>=0){ toast('第 '+(oi+1)+' 题还没填选项','err'); return false; }
  try{
    const r = await api('/api/admin/scale',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ id:ESC.id, name:ESC.meta.name, code:ESC.meta.code,
        shortName:ESC.meta.shortName||ESC.meta.name, responseType:ESC.meta.responseType,
        gradeRange:ESC.meta.gradeRange, dimensionNote:ESC.meta.dimensionNote,
        scoringNote:ESC.meta.scoringNote,
        dims:ESC.dims.map(d=>({key:d.key,id:d.id,name:d.name,itemCount:d.itemCount,
          direction:d.direction,maxScore:d.maxScore,cutNormal:d.cutNormal,cutBorder:d.cutBorder})),
        items:ESC.items.map(it=>({id:it.id,dimId:it.dimId,type:it.type,title:it.title,
          options:it.options,reverse:it.reverse,scoreText:it.scoreText})) })});
    toast(r.message||'已保存','ok'); await loadAll(); return true;
  }catch(e){ toast('保存失败：'+e.message,'err'); return false; }
}

// ==================== 启动 ====================
switchTab('plans');
tryRestore();
</script>
